# Builds wrapped.rock for every Rockbox player with a clock, for Rockbox 4.0
# and for the development version, using Rockbox's official toolchains.
#
# - Push a tag like v1.2.0: builds everything and creates a DRAFT release with
#   all files and a generated player table. Review it, then publish.
# - Actions tab -> "Build plugins" -> Run workflow: builds without releasing
#   (the files are attached to the run as artifacts).
#
# The first run builds each toolchain from source (slow, up to about an hour);
# later runs reuse them from the cache.
name: Build plugins

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  ROCKBOX_REPO: https://github.com/Rockbox/rockbox.git

jobs:
  build:
    name: Rockbox ${{ matrix.rockbox.label }} / toolchain ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        rockbox:
          - { label: '4.0', ref: 'v4.0-final' }
          # The development build the "dev" files are made for. Update this
          # (and the patch, if needed) to follow newer Rockbox dev builds.
          - { label: 'dev', ref: 'acb44bec63' }
        # rockboxdev.sh toolchains: a=ARM, i=MIPS, m=m68k,
        # x=Linux ARM (hosted), y=Linux MIPS (hosted)
        arch: [a, i, m, x, y]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential texinfo flex bison gawk zip \
            wget perl python3 rsync automake autoconf libtool patch xz-utils \
            bzip2 libgmp-dev libmpfr-dev libmpc-dev

      - name: Get Rockbox ${{ matrix.rockbox.ref }}
        run: |
          git init -q rockbox
          git -C rockbox fetch -q --depth 1 "$ROCKBOX_REPO" "${{ matrix.rockbox.ref }}"
          git -C rockbox checkout -q FETCH_HEAD

      - name: Toolchain cache key
        id: tc
        run: echo "key=rbdev-${{ matrix.arch }}-$(sha256sum rockbox/tools/rockboxdev.sh | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore toolchain
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/rbdev
          key: ${{ steps.tc.outputs.key }}

      - name: Build toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          RBDEV_PREFIX="$HOME/rbdev" RBDEV_DOWNLOAD="$RUNNER_TEMP/dl" \
          RBDEV_BUILD="$RUNNER_TEMP/build" \
            bash rockbox/tools/rockboxdev.sh --target=${{ matrix.arch }}
          # rockboxdev.sh can exit 0 on failure: make sure a compiler exists
          ls "$HOME"/rbdev/bin/*-gcc

      # saved straight away, so a failed plugin build doesn't lose it
      - name: Save toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/rbdev
          key: ${{ steps.tc.outputs.key }}

      - name: Build plugins
        run: |
          export PATH="$HOME/rbdev/bin:$PATH"
          bash ci/build-all.sh rockbox "${{ matrix.rockbox.label }}" \
            "${{ matrix.arch }}" out | tee build.txt
          { echo '```'; cat build.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plugins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocks-${{ matrix.rockbox.label }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: warn

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: rocks-*
          path: builds
          merge-multiple: true

      - name: Make zips and release notes
        run: bash ci/make-release.sh builds dist "${{ github.ref_name }}"

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.rock dist/*.zip --clobber
          else
            gh release create "$TAG" --draft --title "Rockbox Wrapped $TAG" \
              --notes-file dist/release-notes.md dist/*.rock dist/*.zip
          fi
