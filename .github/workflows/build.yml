# Builds wrapped.rock for every Rockbox player with a clock, for Rockbox 4.0
# and for the development version, using Rockbox's official toolchains.
#
# - Push a tag like v1.2.0: builds everything and creates a DRAFT release with
#   all files and a generated player table. Review it, then publish.
# - Actions tab -> "Build plugins" -> Run workflow: builds without releasing
#   (the files are attached to the run as artifacts).
#
# The first run builds each toolchain from source (slow, up to about an hour);
# later runs reuse them from the cache.
name: Build plugins

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# "shell: bash" adds -o pipefail, so "build | tee" fails when the build does
defaults:
  run:
    shell: bash

env:
  ROCKBOX_REPO: https://github.com/Rockbox/rockbox.git
  # Rockbox commit whose tools/rockboxdev.sh builds the hosted (x, y)
  # toolchains for BOTH versions: 4.0's copy downloads from dead ftp:// links.
  TOOLCHAIN_REF: acb44bec63270582c5448acce3f70dbcb03fc9a8

jobs:
  build:
    name: Rockbox ${{ matrix.rockbox.label }} / toolchain ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        rockbox:
          - { label: '4.0', ref: 'v4.0-final' }
          # The development build the "dev" files are made for. Update this
          # (and the patch, if needed) to follow newer Rockbox dev builds.
          # Must be a tag or a FULL commit id: GitHub won't fetch a short one.
          - { label: 'dev', ref: 'acb44bec63270582c5448acce3f70dbcb03fc9a8' }
        # rockboxdev.sh toolchains: a=ARM, i=MIPS, m=m68k,
        # x=Linux ARM (hosted), y=Linux MIPS (hosted)
        arch: [a, i, m, x, y]
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential texinfo flex bison gawk zip \
            wget curl perl python3 rsync automake autoconf libtool libtool-bin \
            patch xz-utils bzip2 libgmp-dev libmpfr-dev libmpc-dev \
            gettext gtk-doc-tools pkg-config
          # Same extras as Rockbox's own build servers (tools/docker_rbclient):
          # rockboxdev.sh looks for a "libtool" command (libtool-bin), and the
          # hosted MIPS toolchain builds glib, which needs gettext/gtk-doc-tools.

      - name: Get Rockbox ${{ matrix.rockbox.ref }}
        # Kept at a SHORT path: Rockbox's "Generating dependencies" step puts
        # every source path into one shell command, and with the long
        # /home/runner/work/... prefix that passes Linux's 128 KB limit on
        # big players (iPods, Sansas): "Argument list too long".
        run: |
          git init -q /tmp/rb
          git -C /tmp/rb fetch -q --depth 1 "$ROCKBOX_REPO" "${{ matrix.rockbox.ref }}"
          git -C /tmp/rb checkout -q FETCH_HEAD
          ln -s /tmp/rb rockbox

      # The toolchain is built with this tree's rockboxdev.sh, except for the
      # hosted toolchains (x, y), which always come from TOOLCHAIN_REF.
      - name: Pick the toolchain script
        run: |
          if [[ "${{ matrix.arch }}" == [xy] && "${{ matrix.rockbox.ref }}" != "$TOOLCHAIN_REF" ]]; then
            git init -q tctree
            git -C tctree fetch -q --depth 1 "$ROCKBOX_REPO" "$TOOLCHAIN_REF"
            git -C tctree checkout -q FETCH_HEAD
          else
            ln -s rockbox tctree
          fi

      - name: Toolchain cache key
        id: tc
        run: echo "key=rbdev-${{ matrix.arch }}-$(sha256sum tctree/tools/rockboxdev.sh | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore toolchain
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/rbdev
          key: ${{ steps.tc.outputs.key }}

      - name: Build toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          RBDEV_PREFIX="$HOME/rbdev" RBDEV_DOWNLOAD="$RUNNER_TEMP/dl" \
          RBDEV_BUILD="$RUNNER_TEMP/build" \
            bash tctree/tools/rockboxdev.sh --target=${{ matrix.arch }}
          # rockboxdev.sh can exit 0 on failure: make sure a compiler exists
          ls "$HOME"/rbdev/bin/*-gcc

      - name: Show toolchain build logs
        if: failure() && steps.cache.outputs.cache-hit != 'true'
        run: |
          # the newest log is the step that failed
          for f in $(ls -t "$RUNNER_TEMP"/build/build-*.log 2>/dev/null | head -2); do
            { echo "### $(basename "$f")"; echo '```'; tail -60 "$f"; echo '```'; } \
              | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # saved straight away, so a failed plugin build doesn't lose it
      - name: Save toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/rbdev
          key: ${{ steps.tc.outputs.key }}

      - name: Build plugins
        run: |
          export PATH="$HOME/rbdev/bin:$PATH"
          status=0
          bash ci/build-all.sh rockbox "${{ matrix.rockbox.label }}" \
            "${{ matrix.arch }}" out | tee build.txt || status=$?
          { echo '```'; cat build.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload plugins
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rocks-${{ matrix.rockbox.label }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: warn

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: rocks-*
          path: builds
          merge-multiple: true

      - name: Make zips and release notes
        run: bash ci/make-release.sh builds dist "${{ github.ref_name }}"

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.rock dist/*.zip --clobber
          else
            gh release create "$TAG" --draft --title "Rockbox Wrapped $TAG" \
              --notes-file dist/release-notes.md dist/*.rock dist/*.zip
          fi
